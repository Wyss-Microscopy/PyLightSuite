validation:
  links:
    not_found: ignore
    unrecognized_links: ignore
    anchors: ignore

site_name: PyLightSuite
site_description: Register lightsheet brain and spinal cord volumes to anatomical atlases
repo_url: https://github.com/Wyss-Microscopy/PyLightSuite
repo_name: Wyss-Microscopy/PyLightSuite
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    primary: teal
    accent: purple
  features:
    - navigation.sections
    - navigation.expand
    
extra_css:
  - stylesheets/custom.css
  
nav:
  - Home: index.md
  - Installation: installation.md
  - Usage:
      - Brain lightsheet: usage_lightsheet_brain.md
      - Annotation import: annotation_import.md
      - Registration spaces: registration_spaces.md
      - Spinal cord: usage_spinal_cord.md
  - Configuration reference: config_reference.md
markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
